<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PantryMind AI — A little less waste</title><link rel="stylesheet" href="styles.css"><script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script><script defer src="core.js"></script><script defer src="app.js"></script></head><body>
<aside id="sidebar"><a class="brand" href="#dashboard"><span class="logo">P<span>✦</span></span> PantryMind<small>AI</small></a><p class="eyebrow">YOUR HOUSEHOLD, ORGANIZED</p><nav><button data-page="dashboard">◫ &nbsp; Overview</button><button data-page="inventory">▦ &nbsp; My pantry</button><button data-page="scanner">⌁ &nbsp; Scan receipt <small>OCR</small></button><button data-page="shopping">☷ &nbsp; Shopping list</button><button data-page="analytics">◴ &nbsp; Spending insights</button><button data-page="settings">⚙ &nbsp; Settings & backup</button></nav><div class="side-bottom"><div class="school">✦ &nbsp; AI in Everyday Life<p>Class 10 · School project</p></div><button id="theme">☾ &nbsp; Switch appearance</button><p>Less forgotten. Less wasted.</p></div></aside>
<div id="scrim"></div><main><header><button id="menu" aria-label="Open navigation">☰</button><span id="breadcrumb">Your household / Overview</span><div><span id="modeBadge" class="badge">Personal pantry</span><span class="avatar">RP</span></div></header><div id="notice" role="status" aria-live="polite"></div><section id="content"></section><footer>PantryMind AI <span>Thoughtful groceries. Everyday.</span></footer></main>
<dialog id="itemDialog"><form id="itemForm"><div class="section-head"><h2 id="formTitle">Add grocery</h2><button type="button" id="closeDialog" aria-label="Close">✕</button></div><input name="id" type="hidden"><div class="form-grid"><label class="wide">Item name<input name="name" required maxlength="100" placeholder="e.g. Whole wheat atta"></label><label>Category<select name="category"></select></label><label>Unit<select name="unit"></select></label><label>Current quantity<input name="quantity" type="number" min="0" max="1000000" step="any" required></label><label>Minimum stock<input name="minimum" type="number" min="0" max="1000000" step="any" required></label><label>Purchase date<input name="purchaseDate" type="date" required></label><label>Expiry date (optional)<input name="expiryDate" type="date"></label><label class="wide">Purchase line total ₹ (optional)<input name="price" type="number" min="0" max="100000000" step="0.01"><small>For this purchase, not per unit. Editing stock does not change past spending.</small></label></div><p id="formError" class="error" role="alert"></p><button class="primary" type="submit">Save grocery</button></form></dialog>
</body></html>
